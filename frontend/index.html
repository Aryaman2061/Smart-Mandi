
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MandiMitra - Price Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #167d4a;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5ec;
            border-radius: 5px;
            display: none;
        }

        #error {
            margin-top: 15px;
            color: red;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>MandiMitra Price Prediction</h2>

        <form id="predictionForm">

            <label>State</label>
            <input
                name="state"
                value="Tamil Nadu"
                required
            >

            <label>District</label>
            <input
                name="district"
                value="Pudukkottai"
                required
            >

            <label>Market</label>
            <input
                name="market"
                value="Karambakkudi(Uzhavar Sandhai )"
                required
            >

            <label>Commodity</label>
            <input
                name="commodity"
                value="Tomato"
                required
            >

            <label>Grade</label>
            <input
                name="grade"
                value="Local"
            >

            <button type="submit" id="predictButton">
                Predict Price
            </button>

        </form>

        <div id="result"></div>

        <div id="error"></div>

    </div>


    <script>

        const form = document.getElementById("predictionForm");

        const result = document.getElementById("result");

        const error = document.getElementById("error");

        const button = document.getElementById("predictButton");


        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            result.style.display = "none";

            error.textContent = "";

            button.disabled = true;

            button.textContent = "Predicting...";


            const formData = new FormData(form);

            const inputData = Object.fromEntries(
                formData.entries()
            );


            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/api/v1/predictions/predict",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(inputData)
                    }
                );


                const data = await response.json();


                if (!response.ok) {
                    throw new Error(
                        data.detail || "Prediction failed"
                    );
                }


                const price =
                    data.data.predicted_modal_price;


                result.innerHTML = `
                    <h3>Predicted Modal Price</h3>

                    <h2>
                        ₹${price.toLocaleString("en-IN")}
                    </h2>

                    <p>Per Quintal</p>
                `;


                result.style.display = "block";


            } catch (err) {

                error.textContent = err.message;

            } finally {

                button.disabled = false;

                button.textContent = "Predict Price";

            }

        });

    </script>

</body>
</html>
